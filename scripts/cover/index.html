<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wada Shades cover</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1600px;
        height: 800px;
        background: #f4efe6;
        color: #1d1b18;
        font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif;
      }
      .serif { font-family: 'Bitstream Charter', Charter, Georgia, serif; }
      .cover { display: grid; grid-template-columns: 500px 1fr; height: 100%; padding: 64px 64px 64px 72px; gap: 56px; }
      .text { display: flex; flex-direction: column; justify-content: space-between; }
      h1 { font-weight: 400; font-size: 92px; line-height: 0.95; letter-spacing: -0.01em; }
      .lead { margin-top: 28px; font-size: 22px; line-height: 1.45; color: #4a463f; max-width: 400px; }
      .lead em { color: #1d1b18; }
      .meta { font-size: 15px; color: #6f6a62; line-height: 1.7; letter-spacing: 0.02em; }
      .meta b { color: #1d1b18; font-weight: 500; }
      .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); gap: 18px; }
      .cell { display: flex; flex-direction: column; }
      .tile { flex: 1; display: flex; gap: 3px; }
      .col { flex: 1; display: flex; flex-direction: column; gap: 3px; }
      .col div { flex: 1; border-radius: 2px; }
      .col .base { flex: 1.6; }
      .num { font-size: 11px; color: #8a847a; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="text">
        <div>
          <h1 class="serif">Wada<br />Shades</h1>
          <p class="lead">
            Lighter and darker shades for the 348 combinations of Sanzo Wada&rsquo;s
            <em class="serif">A Dictionary of Colour Combinations</em>.
          </p>
        </div>
        <p class="meta"><b>OKLCH</b> shade ramps · original colours kept<br />Hue shift · colour search · <b>.gpl</b> export</p>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <script type="module" src="./cover.ts"></script>
  </body>
</html>
